<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OmniSnap AI{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20260929.2">

    <style>
    /* =========================================================================
       OmniSnap AI — Embedded Core Stylesheet
       ========================================================================= */
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #111118;
      --text-primary: #ffffff;
      --text-secondary: #8892b0;
      --accent-cyan: #00d4ff;
      --accent-blue: #0088ff;
      --accent-purple: #7b61ff;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-bg-hover: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.15);
      --success: #00e676;
      --warning: #ffea00;
      --danger: #ff1744;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --sidebar-width: 240px;
    }

    html, body {
      background-color: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      margin: 0 !important;
      padding: 0 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }
    *, *::before, *::after {
      box-sizing: inherit;
    }

    a {
      color: inherit;
      text-decoration: none !important;
    }

    body {
      display: flex !important;
      flex-direction: row !important;
      min-height: 100vh !important;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width) !important;
      min-width: var(--sidebar-width) !important;
      background: var(--bg-secondary) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
      display: flex !important;
      flex-direction: column !important;
      height: 100vh !important;
      position: sticky !important;
      top: 0 !important;
      z-index: 100;
      padding: 0;
      flex-shrink: 0;
    }

    .brand {
      padding: 24px 20px 20px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
    }
    .brand h1 {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1rem !important;
      font-weight: 600 !important;
      margin: 0 0 4px !important;
      color: #ffffff !important;
    }
    .ai-badge {
      font-size: 0.6rem;
      padding: 2px 6px;
      background: rgba(0, 212, 255, 0.1);
      color: var(--accent-cyan);
      border-radius: 4px;
      font-weight: 600;
    }
    .brand-subtitle {
      font-size: 0.75rem !important;
      color: var(--text-secondary) !important;
      margin: 0 !important;
    }

    .nav-links {
      flex: 1; padding: 14px 0; overflow-y: auto;
      display: flex !important;
      flex-direction: column !important;
      gap: 2px;
    }
    .nav-link {
      display: flex !important;
      align-items: center !important;
      padding: 10px 20px !important;
      color: var(--text-secondary) !important;
      font-size: 0.85rem !important;
      font-weight: 500 !important;
      transition: background 0.15s ease, color 0.15s ease !important;
      border-left: 2px solid transparent !important;
    }
    .nav-link:hover {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.03) !important;
    }
    .nav-link.active {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.06) !important;
      border-left-color: var(--accent-cyan) !important;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .footer-text {
      font-size: 0.75rem; 
      color: var(--text-secondary); 
    }

    /* Main Content Area */
    .main-content {
      flex: 1 !important;
      padding: 32px 40px !important;
      min-height: 100vh !important;
      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      position: relative !important;
      z-index: 1 !important;
      overflow-y: auto !important;
      max-width: calc(100vw - var(--sidebar-width)) !important;
    }

    /* Common Components */
    .glass-card {
      background: var(--glass-bg) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: var(--radius-md) !important;
      padding: 20px !important;
      color: #ffffff !important;
      transition: border-color 0.2s ease;
    }
    .glass-card:hover {
      border-color: var(--glass-border-hover) !important;
    }

    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin: 28px 0 16px;
    }
    .section-header h2 { font-size: 1.15rem; font-weight: 600; color: #fff; margin: 0; }
    .section-badge {
      font-size: 0.75rem; padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm); color: var(--text-secondary);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .grid-model-gauge { display: grid; grid-template-columns: 1fr 280px; gap: 16px; margin-bottom: 20px; }

    /* Metric Cards */
    .metric-card { text-align: left; padding: 20px !important; }
    .metric-label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 8px; }
    .metric-value { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
    .metric-icon { display: none; }

    /* Model Cards */
    .models-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .model-card { padding: 16px !important; }
    .model-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .model-icon { display: none; }
    .model-card h3 { font-size: 0.95rem; font-weight: 600; margin: 0; color: #fff; }
    .model-meta { display: flex; gap: 6px; margin-bottom: 12px; }
    .model-tag {
      font-size: 0.7rem; padding: 2px 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px; color: var(--text-secondary);
    }
    .model-stat { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .stat-label { font-size: 0.8rem; color: var(--text-secondary); }
    .stat-value { font-size: 0.85rem; font-weight: 500; }
    .stat-value.cyan { color: var(--accent-cyan); }
    .model-source { font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #444; }
    .status-dot.active { background: var(--success); }

    /* NPU Gauge */
    .gauge-card { display: flex; flex-direction: column; align-items: flex-start; padding: 20px !important; }
    .gauge-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 24px; color: #fff; }
    .gauge-container { position: relative; width: 100px; height: 100px; margin: 0 auto 24px; }
    .gauge-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 8; }
    .gauge-fill {
      fill: none; stroke: var(--accent-cyan); stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
    }
    .gauge-value {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: 600; color: var(--text-primary);
    }
    .gauge-info { width: 100%; }
    .gauge-stat {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--text-secondary);
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .gauge-stat:last-child { border-bottom: none; }

    /* Hero */
    .hero { margin-bottom: 32px !important; padding: 32px !important; }
    .hero-content { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
    .hero-text { flex: 1; }
    .hero-title { font-size: 1.75rem !important; font-weight: 600 !important; margin: 0 0 12px !important; color: #fff !important; }
    .hero-subtitle { display: none; }
    .hero-desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; max-width: 600px; }
    .hero-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 0; }
    .hero-badge {
      font-size: 0.75rem; padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm); color: var(--text-secondary);
    }
    .hero-chip { display: none; }

    /* Action Cards */
    .action-card {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 20px !important; text-align: left;
      cursor: pointer; color: #fff;
    }
    .action-icon { display: none; }
    .action-label { font-size: 0.9rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .action-desc { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }

    /* System Info */
    .system-info-card { margin-top: 24px; }
    .system-info-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; color: #fff; }
    .system-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sys-item { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.03); }
    .sys-label { font-size: 0.8rem; color: var(--text-secondary); }
    .sys-value { font-size: 0.8rem; font-weight: 500; color: var(--text-primary); }

    /* Buttons */
    .btn {
      padding: 8px 16px; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: background 0.15s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary {
      background: #ffffff !important;
      color: #000000 !important;
    }
    .btn-primary:hover {
      background: #e0e0e0 !important;
    }
    .btn-glass, .glass-btn {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
    }
    .btn-glass:hover, .glass-btn:hover {
      background: rgba(255, 255, 255, 0.12) !important;
    }

    .glass-input {
      width: 100%; padding: 10px 14px;
      background: rgba(0, 0, 0, 0.2) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: var(--radius-sm);
      color: #ffffff !important;
      font-family: inherit; font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .glass-input:focus {
      border-color: rgba(255, 255, 255, 0.3) !important;
    }
    .glass-input::placeholder { color: var(--text-secondary); }

    /* Toast */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: #fff;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.info { border-left: 3px solid var(--accent-cyan); }
    .toast.warning { border-left: 3px solid var(--warning); }

    /* Responsive */
    @media (max-width: 1200px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-model-gauge { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none !important; }
      .main-content { max-width: 100vw !important; padding: 20px !important; }
      .grid-4 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .models-grid { grid-template-columns: 1fr; }
      .hero-content { flex-direction: column; align-items: flex-start; }
      .system-grid { grid-template-columns: 1fr; }
    }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="brand">
            <h1>OmniSnap <span class="ai-badge">AI</span></h1>
            <p class="brand-subtitle">On-device intelligence</p>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                <span>Dashboard</span>
            </a>
            <a href="/copilot" class="nav-link {% if request.url.path == '/copilot' %}active{% endif %}">
                <span>Copilot</span>
            </a>
            <a href="/meeting" class="nav-link {% if request.url.path == '/meeting' %}active{% endif %}">
                <span>Meeting Scribe</span>
            </a>
            <a href="/rag" class="nav-link {% if request.url.path == '/rag' %}active{% endif %}">
                <span>Document RAG</span>
            </a>
            <a href="/guard" class="nav-link {% if request.url.path == '/guard' %}active{% endif %}">
                <span>Screen Guard</span>
            </a>
            <a href="/benchmarks" class="nav-link {% if request.url.path == '/benchmarks' %}active{% endif %}">
                <span>Benchmarks</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="footer-text">Snapdragon X Elite</div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
